
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUDOS - Algorithm Performance Report</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        header h1 { font-size: 2.5em; margin-bottom: 10px; }
        header p { font-size: 1.1em; opacity: 0.9; }
        .content { padding: 40px; }
        .section {
            margin-bottom: 50px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 40px;
        }
        .section:last-child { border-bottom: none; }
        .section h2 {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(800px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }
        .chart-container {
            background: #f9f9f9;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .chart-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-card h3 { font-size: 1.2em; margin-bottom: 10px; opacity: 0.9; }
        .stat-card .value { font-size: 2em; font-weight: bold; }
        footer {
            background: #f0f0f0;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }
        @media (max-width: 768px) {
            header h1 { font-size: 1.8em; }
            .chart-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚚 SUDOS Performance Report</h1>
            <p>Smart Urban Delivery Optimization System - Algorithm Analysis</p>
        </header>
        
        <div class="content">
            <div class="section">
                <h2>📊 Execution Time Comparison</h2>
                <div class="chart-grid">
                    <div class="chart-container">
                        <img src="execution_time_comparison.png" alt="Execution Time Comparison">
                    </div>
                </div>
            </div>
            
            <div class="section">
                <h2>🎯 Solution Quality Analysis</h2>
                <div class="chart-grid">
                    <div class="chart-container">
                        <img src="solution_quality_comparison.png" alt="Solution Quality">
                    </div>
                </div>
            </div>
            
            <div class="section">
                <h2>⚡ Performance Trade-offs</h2>
                <div class="chart-grid">
                    <div class="chart-container">
                        <img src="time_vs_quality_tradeoff.png" alt="Time vs Quality">
                    </div>
                    <div class="chart-container">
                        <img src="complexity_analysis.png" alt="Complexity Analysis">
                    </div>
                </div>
            </div>
            
            <div class="section">
                <h2>💾 Resource Utilization</h2>
                <div class="chart-grid">
                    <div class="chart-container">
                        <img src="memory_usage_comparison.png" alt="Memory Usage">
                    </div>
                    <div class="chart-container">
                        <img src="summary_table.png" alt="Summary Table">
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>Generated by SUDOS Analysis Module | Algorithm Performance Benchmarking</p>
        </footer>
    </div>
</body>
</html>
